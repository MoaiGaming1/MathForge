[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathforge-engine"
version = "0.1.0"
description = "Local symbolic and numerical engine for MathForge"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "numpy>=1.26", "scipy>=1.12", "mpmath>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
